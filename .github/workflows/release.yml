name: Website checks and release

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: website-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Build and test
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:deployment
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: '1'
      - run: npm run package:release
      - run: npm run test:smoke
      - name: Package tested build
        run: |
          tar -C dist/release -czf dist/cv-website-linux-x64.tar.gz .
          cd dist
          sha256sum cv-website-linux-x64.tar.gz > cv-website-linux-x64.tar.gz.sha256
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: tested-website
          path: |
            dist/cv-website-linux-x64.tar.gz
            dist/cv-website-linux-x64.tar.gz.sha256
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish tested release
    needs: checks
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: tested-website
          path: dist
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(gh api repos/$GH_REPO/commits/main --jq .sha)" = "$GITHUB_SHA"
          tag="deploy-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${GITHUB_SHA:0:12}"
          printf 'Tested commit: %s\n\nChecks: lint, TypeScript, deployment tests, production build, HTTP smoke tests.\nLenovo fetches successful releases automatically; credentials and visitor analytics remain on the server.\n' "$GITHUB_SHA" > release-notes.txt
          gh release create "$tag" dist/cv-website-linux-x64.tar.gz dist/cv-website-linux-x64.tar.gz.sha256 \
            --target "$GITHUB_SHA" --title "Website ${GITHUB_SHA:0:12}" --notes-file release-notes.txt
